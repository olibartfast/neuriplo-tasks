name: Classifier export regressions

on:
  push:
    branches: [develop, 'feature/**', 'feat/**']
    paths:
      - 'export/classification/torchvision/**'
      - 'tests/test_torchvision_export.py'
      - '.github/workflows/export-tests.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - 'export/classification/torchvision/**'
      - 'tests/test_torchvision_export.py'
      - '.github/workflows/export-tests.yml'

jobs:
  preserve-pretrained-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested CPU exporter dependencies
        run: python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exports preserve learned weights
        run: python tests/test_torchvision_export.py
