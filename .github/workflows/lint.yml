name: C++ Lint & Build

on:
  push:
    branches: [master, develop, "release/**", "feature/**", "feat/**"]
    paths-ignore:
      - 'export/**'
      - 'docs/**'
      - 'specs/**'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'PRE_COMMIT_GUIDE.md'
  pull_request:
    branches: [develop, master]
    paths-ignore:
      - 'export/**'
      - 'docs/**'
      - 'specs/**'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'PRE_COMMIT_GUIDE.md'

jobs:
  format-check:
    name: Format Check
    # clang-format is pinned via pip for distro independence.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Check formatting
        run: |
          find src include tests -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format --dry-run --Werror

  clang-tidy:
    name: Clang-Tidy
    # ubuntu-latest moved to 26.04, which no longer ships clang-tidy-18.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Generate compile_commands.json
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run clang-tidy
        run: |
          find src -name '*.cpp' | \
            xargs clang-tidy-18 -p build

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning --std=c++17 --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=*:3rdparty/stb/* \
            -I include src/

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Configure
        run: cmake -S . -B build-valgrind -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build-valgrind --parallel

      - name: Run tests under Valgrind
        run: |
          found_tests=0
          for test_bin in build-valgrind/tests/test_*; do
            if [ ! -x "$test_bin" ]; then
              continue
            fi

            found_tests=1
            echo "::group::$(basename "$test_bin")"
            valgrind \
              --error-exitcode=1 \
              --leak-check=full \
              --show-leak-kinds=definite,indirect \
              --errors-for-leak-kinds=definite,indirect \
              --track-origins=yes \
              --num-callers=25 \
              "$test_bin"
            echo "::endgroup::"
          done

          if [ "$found_tests" -eq 0 ]; then
            echo "No test binaries found under build-valgrind/tests"
            exit 1
          fi

  build-warnings:
    name: Build with Strict Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Configure with -DWERROR=ON
        run: cmake -S . -B build -G Ninja -DWERROR=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

  windows-build:
    name: Windows Build & Test (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DBUILD_TESTS=ON `
            -DWERROR=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
